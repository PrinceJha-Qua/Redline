[project]
name = "redline"
version = "0.1.0"
description = "Catch fabricated and overruled case citations before you file. One Relate file, offline."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "relate-db>=1.0.2",
  "eyecite>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.9,<2",
]

[project.scripts]
redline = "redline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
audit = ["pyarrow>=15"]

[tool.setuptools]
packages = ["redline", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
