name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
